name: Build (Ubuntu)

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: |
          dotnet restore
          dotnet pack -c Release -o ./artifacts/
          dotnet test Packaging.Targets.Tests/Packaging.Targets.Tests.csproj --logger "trx;LogFileName=./Packaging.Targets.Tests.trx"
      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.runs-on }}
          path: ./*.trx
      - name: Copy version.txt and Directory.Build.props
        if: ${{ inputs.runs-on == 'ubuntu' }}
        run: |
          cp demo/Directory.Build.props ./artifacts/
          cp demo/version.txt ./artifacts/
      - name: Publish NuGet Artifacts
        if: ${{ inputs.runs-on == 'ubuntu' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.*
