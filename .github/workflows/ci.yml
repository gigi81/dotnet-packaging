name: continuous-integration

on: [push, pull_request]

jobs:
  build_ubuntu:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:9.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: |
          dotnet restore dotnet-packaging.sln
          dotnet pack dotnet-packaging.sln -c Release -o ${{ github.workspace }}/artifacts
          dotnet test Packaging.Targets.Tests/Packaging.Targets.Tests.csproj --logger "trx;LogFileName=${{ github.workspace }}/artifacts/Packaging.Targets.Tests.trx"
          cp demo/Directory.Build.props ${{ github.workspace }}/artifacts
          cp demo/version.txt ${{ github.workspace }}/artifacts
      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ github.workspace }}/artifacts/*.trx
      - name: Publish NuGet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ${{ github.workspace }}/artifacts

  build_windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        shell: pwsh
        run: |
          dotnet restore dotnet-packaging.sln
          dotnet pack dotnet-packaging.sln -c Release -o $env:GITHUB_WORKSPACE\artifacts
          dotnet test Packaging.Targets.Tests/Packaging.Targets.Tests.csproj --logger "trx;LogFileName=$env:GITHUB_WORKSPACE\artifacts\Packaging.Targets.Tests.trx"
      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: ${{ github.workspace }}\artifacts\*.trx

  build_macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: |
          dotnet restore dotnet-packaging.sln
          dotnet pack dotnet-packaging.sln -c Release -o ${{ github.workspace }}/artifacts
          dotnet test Packaging.Targets.Tests/Packaging.Targets.Tests.csproj --logger "trx;LogFileName=${{ github.workspace }}/artifacts/Packaging.Targets.Tests.trx"
      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ github.workspace }}/artifacts

  build_package:
    name: Build Package Matrix
    runs-on: ubuntu-latest
    needs: build_noble
    strategy:
      fail-fast: false
      matrix:
        command: [deb, rpm, zip, tarball]
        framework: [8.0, 9.0]
    container:
      image: mcr.microsoft.com/dotnet/sdk:${{ matrix.framework }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build Package
        run: |
          dotnet restore dotnet-packaging.sln
          dotnet build dotnet-packaging.sln -c Release
          dotnet pack dotnet-packaging.sln -c Release -o ${{ github.workspace }}/artifacts
          # Add custom build logic for ${{ matrix.command }} if needed
      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-package-${{ matrix.container }}-${{ matrix.command }}
          path: ${{ github.workspace }}/artifacts

  test_macos:
    name: Test (macOS)
    runs-on: macos-latest
    needs: build_macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: ${{ github.workspace }}/packages
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Extract tarball
        run: tar xvzf ${{ github.workspace }}/packages/macos/test-tarball.1.0.0.tar.gz
      - name: Execute program
        run: dotnet ./test-tarball.dll

  molecule:
    name: Molecule Matrix
    runs-on: ubuntu-latest
    needs: build_noble
    strategy:
      fail-fast: false
      matrix:
        suite: [self-contained, framework-dependent]
        framework: [net8.0, net9.0]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install Python and pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install molecule and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install --user setuptools
          pip install --user ansible==4.8.0
          pip install --user molecule==3.5.2
          pip install --user molecule-docker==1.1.0
          pip install --user docker==5.0.3
          pip install --user pytest==6.2.5
          pip install --user testinfra==6.0.0
          ~/.local/bin/molecule --version
          ~/.local/bin/ansible --version
          ~/.local/bin/pytest --version
          dotnet --version
      - name: Download NuGet Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ github.workspace }}/nuget
      - name: Build ${{ matrix.suite }}-app for ${{ matrix.framework }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          cd ${{ matrix.suite }}-app
          echo "<configuration><packageSources><add key='local' value='${{ github.workspace }}/nuget' /></packageSources></configuration>" > NuGet.config
          version=$(cat ${{ github.workspace }}/nuget/version.txt)
          dotnet tool install --global dotnet-deb --version $version --add-source ${{ github.workspace }}/nuget
          dotnet tool install --global dotnet-rpm --version $version --add-source ${{ github.workspace }}/nuget
          dotnet rpm install
          dotnet rpm -o ${{ github.workspace }}/molecule/${{ matrix.suite }}/ -f ${{ matrix.framework }}
          dotnet deb -o ${{ github.workspace }}/molecule/${{ matrix.suite }}/ -f ${{ matrix.framework }}
        working-directory: ${{ github.workspace }}/molecule/${{ matrix.suite }}
      - name: Run molecule tests
        run: |
          export PATH=~/.local/bin/:$PATH
          ~/.local/bin/molecule test
        working-directory: ${{ github.workspace }}/molecule/${{ matrix.suite }}
      - name: Publish test results
        uses: actions/upload-artifact@v4
        with:
          name: molecule-test-results
          path: ${{ github.workspace }}/molecule/${{ matrix.suite }}/molecule/default/pytest.xml

  publish_nuget:
    name: Publish NuGet
    runs-on: windows-latest
    needs: [test_macos, molecule]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Download NuGet Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ github.workspace }}/nuget
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Push NuGet Packages
        run: |
          nuget push "${{ github.workspace }}/nuget/*.nupkg" -Source "https://api.nuget.org/v3/index.json" -ApiKey ${{ secrets.NUGET_API_KEY }}
